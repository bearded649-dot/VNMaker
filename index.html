.vn-canvas,.player-screen{align-items:var(--box-ai,flex-end)}.dialogue-box{margin:var(--mt,0) 0 var(--mb,3.2%);background:var(--box-bg,#0c1323ef);font-family:var(--box-font,inherit)}.player-dialog{margin:var(--mt,0) 0 var(--mb,3%);background:var(--box-bg,#080e1eef);font-family:var(--box-font,inherit)}.dialogue-text{font-size:var(--box-fs,14px)}.player-dialog .dialogue-text{font-size:calc(var(--box-fs,14px)*1.2)}
@keyframes fxFade{from{opacity:0}to{opacity:1}}@keyframes fxSlide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}@keyframes fxZoom{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}.fx-fade{animation:fxFade .7s}.fx-slide{animation:fxSlide .5s}.fx-zoom{animation:fxZoom .6s}
.lint{cursor:pointer;color:#4bd2a0}.lint.warn{color:#f5b85b}.lint:hover{text-decoration:underline}.prow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:7px 9px;background:#1a1e25;border-radius:6px;border-left:3px solid #f5b85b}.prow.error{border-left-color:#ff6d83}.prow b{font-size:11px}
.dashhero h1{font-size:30px;background:linear-gradient(90deg,#fff,#9aa6ff);-webkit-background-clip:text;background-clip:text;color:transparent}.stat{background:var(--panel2);border-radius:10px}.stat b{font-size:26px}

/* ===== v7: varios personajes en pantalla + vista previa fiel ===== */
.vn-canvas,.player-screen{container-type:inline-size}
.vn-canvas .dialogue-box,.player-dialog{font-size:max(10px,calc(var(--fs,14)*.1111cqw));padding:.95em 1.25em;min-height:5.9em;border-radius:.65em;line-height:1.45}
.vn-canvas .dialogue-text,.player-dialog .dialogue-text{font-size:1em;min-height:0}
.player-dialog .dialogue-text{min-height:2.6em}
.vn-canvas .speaker,.player-dialog .speaker{font-size:1.05em;margin-bottom:.3em}
.stagewrap{display:flex}.stagewrap .vn-canvas{margin:auto;flex:none}
.stagebar{flex-wrap:wrap}.stagebar button{white-space:nowrap}.stagebar .sp{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spw{outline:none}.spw:hover{outline:1px dashed #5b6cffaa}.spw>img{transition:filter .25s}.spw.dim>img{filter:brightness(var(--dimf,.6))}
.selfr{position:absolute;width:fit-content;pointer-events:none;outline:1px solid #5b6cffbb}.selfr>img{height:100%;width:auto;display:block;visibility:hidden}.selfr .hd{pointer-events:auto}
.canvas-character{transition:filter .25s}.canvas-character.dim{filter:drop-shadow(0 10px 15px #0008) brightness(var(--dimf,.6))}
.cast{display:grid;gap:5px}.crow{display:flex;align-items:center;gap:8px;padding:5px 7px;background:#191d23;border:1px solid #262b34;border-radius:6px;cursor:pointer}.crow:hover{border-color:#3b4350}.crow.sel{border-color:var(--acc);background:#1a1f33}.crow img,.crow .cph{width:22px;height:28px;object-fit:contain;background:#0e1116;border-radius:4px;display:grid;place-items:center;color:#5b6a8a;flex:none}.crow b{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cdot{width:8px;height:8px;border-radius:50%;flex:none}.cdet{display:grid;gap:11px;padding:10px;background:#12151a;border:1px solid #262b34;border-radius:8px}
</style>
<style>
/* ===== v8: el juego debe verse igual que la vista previa ===== */
/* 1) La pantalla del juego recortaba distinto: la vista previa tiene overflow:hidden y el juego no, así que sprites/fondo movidos o rotados fuera del marco se veían en el juego pero no en el editor */
.player-screen{overflow:hidden}
/* 2) En ventanas bajas la pantalla del juego (ancho fijo 1100px) se salía por abajo; ahora se ajusta a la altura disponible manteniendo 16:9 */
.player-shell{width:min(1100px,100%,calc((100vh - 115px)*16/9));width:min(1100px,100%,calc((100dvh - 115px)*16/9))}
/* 3) El degradado oscuro solo existía en la vista previa, no en el juego */
.vn-canvas:before{display:none}
</style>
<style>
/* ===== v9: diseño "mesa de escritor nocturna" ===== */
:root{--bg:#100f17;--panel:#171522;--panel2:#1d1a2b;--panel3:#262239;--line:#2e2a43;--muted:#9a93b2;--text:#ece8f5;--acc:#a58bff;--violet:#a58bff;--lamp:#f0c674;--ui:"Hanken Grotesk",Inter,ui-sans-serif,system-ui,sans-serif;--serif:Newsreader,Georgia,"Times New Roman",serif}
body{font-family:var(--ui);font-size:13.5px;line-height:1.5;background:var(--bg)}
.topbar,.rail,.statusbar,.itabs{background:#0e0d15}
.topbar{border-bottom-color:var(--line)}
.brand{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:0}
.brand span,.brand small{font-family:var(--ui);font-weight:500;color:var(--muted)}
.brandmark{background:var(--acc);color:#150f2b;border-radius:7px;font-family:var(--serif)}
button{background:#221f33;border-color:#353049;border-radius:7px;font-weight:500}
button:hover{background:#2b2742;border-color:#4b4469}
button.primary{background:var(--acc);color:#150f2b;font-weight:650}button.primary:hover{background:#b8a2ff}
button.on,.seg button.on{background:#322a5a;border-color:#6b5bc0;color:#efeaff}.seg button.on{background:var(--acc);color:#150f2b}
button.danger{color:#ff9fb0}
.mi:hover,.mi.open{background:#252139}.dd{background:#1b1829;border-color:#3a3454}.dd div:hover,.pal-row.sel,.pal-row:hover{background:var(--acc);color:#150f2b}
/* navegación: indicador lateral en vez de cajas */
.rail .nav{color:#9a93b2}.rail .nav:hover{color:#fff}
.rail .nav.active{background:transparent;border-color:transparent;color:#fff;box-shadow:inset 3px 0 0 var(--acc);border-radius:0 8px 8px 0}
.rail .nav.active .ico{color:var(--acc)}
.scene-item{border-radius:7px;border:1px solid transparent}.scene-item.active{background:#221e36;border-color:transparent;box-shadow:inset 3px 0 0 var(--acc);color:#fff}
.sidebar,.inspector{background:var(--panel)}
/* etiquetas en minúsculas y legibles, sin versalitas separadas */
.section-label,.vhead,.panel-head,.tlrow label{text-transform:none;letter-spacing:0}
.section-label{font-size:12px;font-weight:600;color:var(--muted)}
.panel-head{height:38px;font-size:12.5px;font-weight:600;color:#c9c3dd;background:#1a1727}
.panel,.preview-card{background:var(--panel);border-radius:12px}
.stagebar{background:#1a1727}
.pagehead h1,.side-head{font-family:var(--serif);font-weight:600;letter-spacing:0}
.pagehead h1{font-size:26px;line-height:1.15}
.crumbs b{font-family:var(--serif);font-weight:600}
.field input,.field textarea,.field select,.inline-input,.sbrow select,.sbrow textarea,.vrow input,.vrow select,.seg,.track,.thumbs img{background:#0f0e16;border-color:#2f2a45;border-radius:7px}
.field textarea,.sbrow textarea{font-family:var(--serif);font-size:15px;line-height:1.5}
.field label{color:#b4aecb;font-weight:500}
.list-row,.asset,.stat,.project-card,.ccard{background:var(--panel2);border-color:var(--line)}
.ccard.sel,.sbrow.sel{background:#201c36;border-color:var(--acc)}.sbrow.sel{border-left-color:var(--acc)}
.notice{background:#1c1832;border-color:#4a3f84;color:#d3cdf2}
.tab{color:#a39cbb}.tab.active,.itabs button.on{color:#fff;border-bottom-color:var(--acc)}
.itabs button{color:#a39cbb}
/* escenario: el protagonista del editor */
.stagewrap{background:radial-gradient(120% 95% at 50% 35%,#1d1933,#0b0a11);padding:28px}
.vn-canvas,.player-screen{border-color:#40395f;border-radius:3px}
.vn-canvas{box-shadow:0 0 0 7px #ffffff07,0 26px 70px #000b}
/* caja de texto: igual en editor y juego */
.vn-canvas .dialogue-box,.player-dialog{border:1px solid #f0c67440;border-radius:.5em;box-shadow:0 .5em 1.8em #0008}
.vn-canvas .speaker,.player-dialog .speaker{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.15em}
.vn-canvas .dialogue-text,.player-dialog .dialogue-text{line-height:1.55}
.choices button{background:#1c1830e6;border-color:#f0c67455;border-radius:7px}.choices button:hover{background:#2a2447;border-color:var(--lamp)}
.player-overlay{background:radial-gradient(110% 90% at 50% 30%,#1a1630,#07060c)}
.player-top{color:#b4aecb}
/* línea de tiempo */
.clip{background:#5a4cb0}.clip.dec{background:#a8507f}.clip.aud{background:#2b8070}
.clip.sel{outline-color:var(--lamp)}
.project-thumb{background:linear-gradient(135deg,#1d1933,#5a4cb0)}
.statusbar{border-top-color:var(--line)}
::-webkit-scrollbar-thumb{background:#33304a}
</style>
<style>
input[type=range]{accent-color:var(--acc)}
.itabs button.on{background:transparent;color:#fff}
.itabs button:hover{background:#171525}
.crow.sel{border-color:var(--acc);background:#201c36}
.vn-canvas .dialogue-box,.player-dialog{border-color:#f0c67440}
</style>
<style>
/* v10: caja de texto personalizable */
.vn-canvas .dialogue-box,.player-dialog{width:var(--box-w,92%);border-radius:var(--box-r,.5em);border-color:var(--box-bc,#f0c67440)}
.vn-canvas .dialogue-text,.player-dialog .dialogue-text{color:var(--box-tc,#f0f3fa)}
</style>
<style>input[type=color]{height:34px;padding:3px;cursor:pointer}</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><div class="brandmark">N</div> NovelForge <span class="muted">STUDIO</span></div>
    <div class="projectname" id="topProject">Centro de proyectos</div>
    <div class="top-actions" id="topActions"><button class="ghost" onclick="showDashboard()">Inicio</button><button class="primary" onclick="newProject()">＋ Nuevo proyecto</button></div>
  </header>
  <div id="dashboard" class="dashboard">
    <div class="dashhero"><div><h1>Tu espacio creativo.</h1><p>Diseña historias, construye rutas y da vida a tus personajes.</p></div><div class="actions"><button onclick="document.getElementById('projectImport').click()">Abrir proyecto</button><button class="primary" onclick="newProject()">＋ Nuevo proyecto</button><input id="projectImport" type="file" accept=".json" hidden onchange="importProjectFile(event)"></div></div>
    <div class="dashstats"><div class="stat"><b id="statProjects">0</b><span>Proyectos locales</span></div><div class="stat"><b id="statScenes">0</b><span>Escenas creadas</span></div><div class="stat"><b>100%</b><span>Almacenamiento local activo</span></div></div>
    <div class="pagehead"><div><h1>Proyectos recientes</h1><p>Se guardan automáticamente en este navegador.</p></div><button id="trashBtn" onclick="dashTrash=!dashTrash;renderDashboard()">🗑 Papelera</button> <input id="projectSearch" class="inline-input" style="max-width:230px" placeholder="Buscar proyectos…" oninput="renderDashboard()"></div>
    <div id="projectGrid" class="project-grid"></div>
  </div>
  <div id="workspace" class="workspace hidden">
    <aside class="sidebar">
      <div class="section-label">Proyecto</div>
      <button class="nav active" data-page="editor" onclick="setPage('editor')"><span class="ico">▣</span> Editor</button>
      <button class="nav" data-page="characters" onclick="setPage('characters')"><span class="ico">♙</span> Personajes</button>
      <button class="nav" data-page="assets" onclick="setPage('assets')"><span class="ico">▧</span> Recursos</button>
      <button class="nav" data-page="variables" onclick="setPage('variables')"><span class="ico">⌘</span> Variables</button>
      <button class="nav" data-page="flow" onclick="setPage('flow')"><span class="ico">⑂</span> Rutas</button>
      <button class="nav" data-page="settings" onclick="setPage('settings')"><span class="ico">⚙</span> Configuración</button>
      <div class="section-label">Escenas</div>
      <div class="side-head"><span>Explorador</span><button class="small" onclick="addScene()">＋</button></div>
      <div id="sceneList"></div>
      <div style="margin-top:18px"><button class="nav" onclick="duplicateScene()">▢ Duplicar escena</button><button class="nav" onclick="deleteScene()">× Eliminar escena</button></div>
    </aside>
    <main class="main" id="main"></main>
    <aside class="inspector" id="inspector"></aside>
  </div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div><div id="playerRoot"></div>
<script>
const KEY='novelforge_projects_v1';
let projects=[],project=null,page='editor',sceneId=null,dirty=false,autosaveTimer=null,selectedCharacter=null,assetFilter='todos',playerState=null;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blankProject(name='Mi novela visual',genre='Misterio'){return {id:uid(),name,description:'Una nueva historia creada con NovelForge Studio.',genre,language:'Español',resolution:'1920x1080',created:Date.now(),modified:Date.now(),characters:[],assets:[],variables:[],scenes:[{id:uid(),name:'Prólogo',chapter:'Capítulo 1',background:null,dialogues:[{id:uid(),speaker:'Narrador',text:'La historia comienza aquí…',characterId:null,expression:'Normal'}],choices:[],next:null,note:''}],settings:{dialogueColor:'#b6a6ff',textSpeed:35,autoSave:true},favorite:false,trash:false};}
function load(){try{projects=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{projects=[]}if(!Array.isArray(projects))projects=[];renderDashboard()}
function persist(){if(project){project.modified=Date.now();const i=projects.findIndex(p=>p.id===project.id);if(i>=0)projects[i]=project;else projects.unshift(project)}try{localStorage.setItem(KEY,JSON.stringify(projects));dirty=false;updateStatus()}catch(e){toast('No se pudo guardar: almacenamiento local lleno. Exporta una copia.');}}
function _touch(){dirty=true;updateStatus();clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{if(project?.settings?.autoSave!==false)persist()},650)}
function toast(msg){$('toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('toastRoot').innerHTML='',2600)}
function fmtDate(t){return new Date(t).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})}
function newProject(){modal('Nuevo proyecto',`<div class="field"><label>Nombre del proyecto</label><input id="newName" value="Mi novela visual"></div><div class="field"><label>Género / plantilla</label><select id="newGenre">${['Romance','Terror psicológico','Misterio','Fantasía','Ciencia ficción','Slice of Life','Thriller','Drama','Proyecto vacío'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Descripción</label><textarea id="newDesc">Una nueva historia creada con NovelForge Studio.</textarea></div>`,`<button onclick="closeModal()">Cancelar</button><button class="primary" onclick="createProject()">Crear proyecto</button>`)}
function _openProject(id){project=projects.find(p=>p.id===id);if(!project)return;sceneId=project.scenes[0]?.id||null;page='editor';$('dashboard').classList.add('hidden');$('workspace').classList.remove('hidden');$('topProject').textContent=project.name;$('topActions').innerHTML=`<span id="saveStatus" class="status">✓ Guardado</span><button class="ghost" onclick="showDashboard()">Inicio</button><button onclick="undo()" title="Deshacer (Ctrl+Z)">↶</button><button onclick="redoA()" title="Rehacer (Ctrl+Y)">↷</button><button onclick="playProject()">▶ Probar</button><button onclick="exportProject()">Proyecto JSON</button><button class="primary" onclick="exportGame()" title="Juego jugable en un solo HTML">⇩ Juego HTML</button>`;renderWorkspace()}
function _showDashboard(){if(project&&dirty)persist();project=null;$('workspace').classList.add('hidden');$('dashboard').classList.remove('hidden');$('topProject').textContent='Centro de proyectos';$('topActions').innerHTML=`<button class="ghost" onclick="showDashboard()">Inicio</button><button class="primary" onclick="newProject()">＋ Nuevo proyecto</button>`;renderDashboard()}
function setPage(p){page=p;document.querySelectorAll('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));renderWorkspace()}
function currentScene(){return project?.scenes.find(s=>s.id===sceneId)}
function selectScene(id){sceneId=id;selD=0;page='editor';renderWorkspace()}
function renderSceneList(){$('sceneList').innerHTML=(project.scenes||[]).map((s,i)=>`<div class="scene-item ${s.id===sceneId?'active':''}" onclick="selectScene('${s.id}')"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="scene-title">${esc(s.name)}</span><button class="mini-del" onclick="event.stopPropagation();renameScene('${s.id}')">✎</button></div>`).join('')}
function addScene(){const s={id:uid(),name:'Nueva escena',chapter:'Capítulo 1',background:null,dialogues:[],choices:[],next:null,note:''};project.scenes.push(s);sceneId=s.id;touch();renderWorkspace();toast('Escena creada')}
function duplicateScene(){const s=currentScene();if(!s)return;const c=JSON.parse(JSON.stringify(s));c.id=uid();c.name+=' (copia)';c.dialogues.forEach(d=>d.id=uid());project.scenes.splice(project.scenes.indexOf(s)+1,0,c);sceneId=c.id;touch();renderWorkspace()}
function deleteScene(){const s=currentScene();if(!s)return;if(project.scenes.length===1)return toast('El proyecto debe conservar al menos una escena.');if(!confirm(`¿Eliminar "${s.name}"?`))return;project.scenes=project.scenes.filter(x=>x.id!==s.id);project.scenes.forEach(x=>{if(x.next===s.id)x.next=null;(x.choices||[]).forEach(c=>{if(c.target===s.id)c.target=null})});sceneId=project.scenes[0].id;touch();renderWorkspace()}
function renameScene(id){const s=project.scenes.find(x=>x.id===id);const n=prompt('Nombre de la escena:',s.name);if(n?.trim()){s.name=n.trim();touch();renderWorkspace()}}
function renderWorkspace(){if(!project)return;injectFonts();renderSceneList();if(page==='editor')renderEditor();else if(page==='characters')renderCharacters();else if(page==='assets')renderAssets();else if(page==='variables')renderVariables();else if(page==='flow')renderFlow();else renderSettings();updateStatus()}
function _renderEditor(){const s=currentScene();if(!s){$('main').innerHTML='<div class="notice">Crea una escena para empezar.</div>';return}
const bg=project.assets.find(a=>a.id===s.background);const dlg=s.dialogues[Math.min(selD,s.dialogues.length-1)]||{speaker:'Narrador',text:'Añade un bloque de diálogo…'};const character=project.characters.find(c=>c.id===dlg.characterId);const sprite=character?.sprites?.find(x=>x.name===dlg.expression)?.data||character?.image;
$('main').innerHTML=`<div class="pagehead"><div><h1>Editor de escenas</h1><p>${esc(project.name)} / ${esc(s.chapter)} / ${esc(s.name)}</p></div><div class="toolbar"><button onclick="addDialogue()">＋ Diálogo</button><button onclick="addChoice()">⑂ Decisión</button><button class="primary" onclick="playProject()">▶ Ejecutar</button></div></div>
<div class="editor-grid"><section class="preview-card"><div class="panel-head"><span>▣ Vista previa · ${esc(s.name)}</span><span class="muted tiny">${esc(project.resolution)}</span></div><div class="preview-wrap"><div class="vn-canvas ${edBox?'':'nobox'}" style="${bg?`background-image:url('${bg.data}')`:''}">${!bg?'<div class="empty-canvas"><div><b>Vista previa de escena</b>Asigna un fondo desde el inspector</div></div>':''}${sprite?`<img class="canvas-character" src="${sprite}">`:''}<div class="dialogue-box"><div class="speaker" style="color:${esc(character?.color||project.settings.dialogueColor)}">${esc(dlg.speaker||'Narrador')}</div><div class="dialogue-text">${esc(dlg.text||'')}</div></div></div></div></section>
<section class="panel"><div class="panel-head"><span>Secuencia de diálogo</span><span class="muted tiny">${s.dialogues.length} bloques</span></div><div class="list">${s.dialogues.map((d,i)=>`<div class="list-row" style="cursor:pointer;${i===selD?'border-color:#7668cf':''}" onclick="selD=${i};renderEditor()"><div class="avatar">${i+1}</div><div class="grow"><strong>${esc(d.speaker||'Narrador')}</strong><small>${esc(d.text||'Sin texto').slice(0,100)}</small></div><button class="small" onclick="event.stopPropagation();moveDlg(${i},-1)">↑</button><button class="small" onclick="event.stopPropagation();moveDlg(${i},1)">↓</button><button class="small" onclick="event.stopPropagation();editDialogue('${d.id}')">Editar</button><button class="small danger" onclick="event.stopPropagation();removeDialogue('${d.id}')">×</button></div>`).join('')||'<div class="muted tiny">Aún no hay diálogos.</div>'}</div></section>
<section class="panel"><div class="panel-head"><span>Decisiones de esta escena</span><button class="small" onclick="addChoice()">＋ Añadir</button></div><div class="list">${(s.choices||[]).map((c,i)=>`<div class="list-row"><div class="grow"><strong>${esc(c.text)}</strong><small>Destino: ${esc(project.scenes.find(x=>x.id===c.target)?.name||'Sin destino')}${c.cond?.var?' · si '+esc(c.cond.var+' '+c.cond.op+' '+c.cond.val):''}${c.effect?.var?' · efecto '+esc(c.effect.var+' '+c.effect.op+' '+c.effect.val):''}</small></div><button class="small" onclick="editChoice('${c.id}')">Editar</button><button class="small danger" onclick="removeChoice('${c.id}')">×</button></div>`).join('')||'<div class="muted tiny">Sin decisiones: el reproductor usará la siguiente escena.</div>'}</div></section>
<section class="panel"><div class="panel-head"><span>Línea temporal</span><span class="muted tiny">Secuencia de eventos</span></div><div class="timeline"><div class="timeline-row"><span>Diálogo</span><div class="track">${s.dialogues.map(()=>'<div class="clip"></div>').join('')}</div></div><div class="timeline-row"><span>Transición</span><div class="track"><div class="clip" style="background:#398caa;max-width:25%"></div></div></div><div class="timeline-row"><span>Audio</span><div class="track">${s.music?esc(project.assets.find(a=>a.id===s.music)?.name||''):'<span class="muted">Sin pista asignada</span>'}</div></div></div></section></div>`;

function varSel(id,v){return `<select id="${id}"><option value="">— variable —</option>${project.variables.map(x=>`<option ${x.name===v?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}

function readFx(p){const v=$(p+'V').value;return v?{var:v,op:$(p+'O').value,val:$(p+'X').value}:null}
function coerce(x){if(x==='true')return true;if(x==='false')return false;const n=Number(x);return x!==''&&!isNaN(n)?n:x}
function condOk(c,vars){if(!c||!c.var)return true;const a=vars[c.var],b=coerce(c.val);switch(c.op){case'>=':return a>=b;case'<=':return a<=b;case'>':return a>b;case'<':return a<b;case'!=':return a!=b;default:return a==b}}
function applyFx(f,vars){if(!f||!f.var)return;const b=coerce(f.val);if(f.op==='+')vars[f.var]=(Number(vars[f.var])||0)+Number(b);else if(f.op==='-')vars[f.var]=(Number(vars[f.var])||0)-Number(b);else vars[f.var]=b}

function saveDialogue(id){const s=currentScene(),i=s.dialogues.findIndex(x=>x.id===id),d=s.dialogues[i],ex=$('dlgExpr').value,ps=$('dlgPos').value;d.characterId=$('dlgChar').value||null;d.speaker=$('dlgSpeaker').value;d.text=$('dlgText').value;d.effect=readFx('dlgF');d.sfx=$('dlgSfx').value||null;if(castAt(s,i).on){if(d.characterId){const st=ownStage(s,i);let m=st.find(x=>x.characterId===d.characterId);if(!m&&st.length<MAXC){m={characterId:d.characterId};st.push(m)}if(m){m.expression=ex;if(m.position!==ps&&m.tf)delete m.tf.x;m.position=ps}}}else{d.expression=ex;d.position=ps}touch();closeModal();renderWorkspace()}

function renderFlow(){const S=project.scenes,dep={},q=[],outs=s=>s.choices?.length?s.choices.map(c=>({to:c.target,l:c.text})):s.next?[{to:s.next,l:''}]:[];
if(S[0]){dep[S[0].id]=0;q.push(S[0].id)}
while(q.length){const s=scn(q.shift());outs(s).forEach(o=>{if(o.to&&dep[o.to]==null&&scn(o.to)){dep[o.to]=dep[s.id]+1;q.push(o.to)}})}
const unreach=S.filter(s=>dep[s.id]==null),md=Math.max(0,...Object.values(dep));unreach.forEach(s=>dep[s.id]=md+1);
const cols=[];S.forEach(s=>(cols[dep[s.id]]=cols[dep[s.id]]||[]).push(s));
const W=170,H=44,GX=80,GY=22,P={};cols.forEach((a,d)=>a&&a.forEach((s,i)=>P[s.id]={x:20+d*(W+GX),y:20+i*(H+GY)}));

/* Plantillas de inicio por género */
const TPL={Romance:['Luna','La lluvia empezaba a caer cuando nuestras miradas se cruzaron.','Ofrecerle tu paraguas','Seguir caminando','afinidad'],'Terror psicológico':['Elena','La casa llevaba años vacía, pero alguien había encendido la luz del sótano.','Bajar al sótano','Salir de la casa','cordura'],Misterio:['Inspectora Vega','La puerta del estudio estaba entreabierta y la luz seguía encendida.','Examinar el escritorio','Interrogar al mayordomo','pistas'],Fantasía:['Aldric','El mapa brillaba con una luz que no debía existir en este mundo.','Seguir el sendero del bosque','Cruzar las montañas','valor'],'Ciencia ficción':['IA-7','La nave despertó del hibernado treinta años antes de lo previsto.','Revisar el puente de mando','Contactar con la Tierra','energia'],'Slice of Life':['Sora','El primer día de curso empezó con la bici pinchada.','Ir caminando','Pedir ayuda a un compañero','amistad'],Thriller:['Marcos','El móvil vibró: «Sé lo que hiciste». Número oculto.','Responder el mensaje','Ignorarlo y huir','tension'],Drama:['Clara','La carta llevaba diez años sin abrirse sobre la mesa.','Abrir la carta','Guardarla de nuevo','confianza']};
function applyTemplate(p,g){const[n,op,a,b,v]=TPL[g]||TPL.Misterio,ch={id:uid(),name:n,internalName:n.toLowerCase().replace(/\W+/g,'_'),description:'Personaje principal',bio:'',color:'#ff8fb1',image:null,sprites:[]};p.characters.push(ch);p.variables.push({id:uid(),name:v,type:'Número',value:0});
const mk=(name,dl)=>({id:uid(),name,chapter:'Capítulo 1',background:null,dialogues:dl.map(([c,t])=>({id:uid(),speaker:c?n:'Narrador',text:t,characterId:c?ch.id:null,expression:'Normal'})),choices:[],next:null,note:''});
const[s1,s2,s3,s4,s5]=[mk('Prólogo',[[0,op],[1,'—No esperaba encontrarte aquí.']]),mk('Encuentro',[[0,'El momento exigía una decisión.']]),mk('Ruta A',[[1,'—Gracias. Me alegra que te hayas decidido.']]),mk('Ruta B',[[1,'—Quizá en otra ocasión…']]),mk('Final del capítulo',[[0,'Continuará…']])];
s1.next=s2.id;s2.choices=[{id:uid(),text:a,target:s3.id,effect:{var:v,op:'+',val:'1'}},{id:uid(),text:b,target:s4.id}];s3.next=s5.id;s4.next=s5.id;p.scenes=[s1,s2,s3,s4,s5]}
function createProject(){const g=$('newGenre').value,p=blankProject($('newName').value.trim()||'Mi novela visual',g);p.description=$('newDesc').value;if(g!=='Proyecto vacío')applyTemplate(p,g);projects.unshift(p);project=p;closeModal();persist();openProject(p.id)}
/* Interfaz del juego (caja de diálogo) */
function uiVars(ch){injectFonts();const G=project.settings.ui||{},u={...G,...(ch?.ui||{})},c=(u.boxColor||'#0c1323').replace('#',''),rgb=[0,2,4].map(i=>parseInt(c.substr(i,2),16)).join(','),P={top:['3.2%','0','flex-start'],mid:['0','0','center']}[u.pos]||['0','3.2%','flex-end'];return `--box-bg:rgba(${rgb},${(u.boxOp??94)/100});--box-fs:${u.size||14}px;--fs:${u.size||14};--dimf:${((100-(G.dim??40))/100).toFixed(2)};--box-font:${fontCss(u.font)};--mt:${P[0]};--mb:${P[1]};--box-ai:${P[2]};--box-tc:${u.textColor||'#f0f3fa'};--box-bc:${u.borderColor||'#f0c67440'};--box-r:${u.radius!=null?u.radius+'px':'.5em'};--box-w:${u.width||92}%`}
let _fsig='';
const fontAssets=()=>(project?.assets||[]).filter(a=>a.kind==='font');
function injectFonts(){const fs=fontAssets(),sig=fs.map(a=>a.id).join();if(sig===_fsig)return;_fsig=sig;let st=document.getElementById('nfFonts');if(!st){st=document.createElement('style');st.id='nfFonts';document.head.appendChild(st)}st.textContent=fs.map(a=>`@font-face{font-family:"NF_${a.id}";src:url("${a.data}");font-display:swap}`).join('\n')}
function fontCss(v){if(v&&String(v).startsWith('a:')){const a=fontAssets().find(x=>x.id===v.slice(2));if(a)return `'NF_${a.id}',Georgia,serif`}return {sans:'var(--ui)',serif:'Georgia,serif',mono:'ui-monospace,Menlo,monospace'}[v]||'Newsreader,Georgia,serif'}
const uiChar=sc=>sc==='g'?null:project.characters.find(x=>x.id===sc);
function uiObj(sc){if(sc==='g')return project.settings.ui=project.settings.ui||{};const c=uiChar(sc);return c.ui=c.ui||{}}
function setUI(k,v,sc='g'){const o=uiObj(sc);if(v===''||v==null)delete o[k];else o[k]=v;touch();uiPrev(sc)}
function resetUI(sc){const c=uiChar(sc);if(c)delete c.ui;touch();refreshUiFields(sc);uiPrev(sc)}
function charBoxModal(id){const c=uiChar(id);modal('Caja de texto de '+c.name,uiFields(id),'<button class="primary" onclick="closeModal();renderWorkspace()">Listo</button>')}
function uiPrev(sc){const e=document.getElementById('uiPrev_'+sc);if(e)e.setAttribute('style',uiVars(uiChar(sc))+';width:100%;aspect-ratio:16/6;pointer-events:none;cursor:default')}
function refreshUiFields(sc){const e=document.getElementById('uiF_'+sc);if(e)e.innerHTML=uiInner(sc)}
async function addFontAsset(f){const a={id:uid(),name:f.name,type:'Fuente',kind:'font',data:await fileData(f),mime:f.type,size:f.size};project.assets.push(a);injectFonts();return a}
function importFont(sc){const i=document.createElement('input');i.type='file';i.accept='.ttf,.otf,.woff,.woff2,font/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;const a=await addFontAsset(f);setUI('font','a:'+a.id,sc);refreshUiFields(sc);toast('Fuente importada: '+a.name)};i.click();refreshUiFields(sc)}
function uiInner(sc){const own=uiObj(sc),g=project.settings.ui||{},isC=sc!=='g',u=k=>own[k]!==undefined?own[k]:g[k],inh=k=>isC&&own[k]===undefined?'<span class="tiny muted"> · del proyecto</span>':'',rst=k=>isC&&own[k]!==undefined?`<button class="small ghost" title="Volver al valor del proyecto" onclick="setUI('${k}','','${sc}');refreshUiFields('${sc}')">↺</button>`:'';
const rng=(k,lab,min,max,def,unit)=>`<div class="field"><label>${lab} <b>${u(k)??def}</b>${unit}${inh(k)}${rst(k)}</label><input type="range" min="${min}" max="${max}" value="${u(k)??def}" oninput="this.closest('.field').querySelector('b').textContent=this.value;setUI('${k}',+this.value,'${sc}')" onchange="refreshUiFields('${sc}')"></div>`;
const col=(k,lab,def)=>`<div class="field"><label>${lab}${inh(k)}${rst(k)}</label><input type="color" value="${(u(k)||def).slice(0,7)}" oninput="setUI('${k}',this.value,'${sc}')" onchange="refreshUiFields('${sc}')"></div>`;
const sel=(k,lab,list,extra='')=>{const L=isC?[['','Como el proyecto'],...list]:list,cur=isC?(own[k]??''):(own[k]||list[0][0]);return `<div class="field"><label>${lab}</label><select onchange="${extra?`if(this.value==='__imp')return importFont('${sc}');`:''}setUI('${k}',this.value,'${sc}');refreshUiFields('${sc}')">${L.map(([v,l])=>`<option value="${v}" ${cur===v?'selected':''}>${esc(l)}</option>`).join('')}${extra}</select></div>`};
const fonts=[['','Predeterminada (Newsreader)'],['sans','Sans-serif'],['serif','Georgia'],['mono','Monoespaciada'],...fontAssets().map(a=>['a:'+a.id,a.name.replace(/\.[^.]+$/,'')+' (importada)'])];
return `<div class="row2">${col('boxColor','Color de la caja','#0c1323')}${rng('boxOp','Opacidad',30,100,94,'%')}</div><div class="row2">${col('textColor','Color del texto','#f0f3fa')}${col('borderColor','Color del borde','#f0c674')}</div><div class="row2">${sel('font','Fuente',isC?fonts.slice(1):fonts,'<option value="__imp">＋ Importar fuente…</option>')}${sel('pos','Posición',[['bottom','Abajo'],['mid','Centro'],['top','Arriba']])}</div>${rng('size','Tamaño del texto',11,28,14,'px')}${rng('radius','Esquinas redondeadas',0,32,8,'px')}${rng('width','Ancho de la caja',50,100,92,'%')}${isC?`<div class="actions"><button class="small" onclick="resetUI('${sc}')">Usar la caja del proyecto</button></div>`:`<div class="field"><label>Oscurecer a los personajes que no hablan ${g.dim??40}%</label><input type="range" min="0" max="80" value="${g.dim??40}" onchange="setUI('dim',+this.value);refreshUiFields('g')"></div>`}`}
function uiFields(sc='g'){const ch=uiChar(sc);return `<div class="field"><label>${ch?'Caja de texto de '+esc(ch.name):'Interfaz del juego · caja de diálogo'}</label></div><div class="vn-canvas" id="uiPrev_${sc}" style="${uiVars(ch)};width:100%;aspect-ratio:16/6;pointer-events:none;cursor:default"><div class="dialogue-box"><div class="speaker" style="color:${esc(ch?.color||project.settings.dialogueColor)}">${ch?esc(ch.name):'Nombre'}</div><div class="dialogue-text">Así se verá el texto en el juego.</div></div></div><div id="uiF_${sc}" style="display:grid;gap:10px;margin-top:10px">${uiInner(sc)}</div>`}
/* Transiciones de escena */
function fxCls(s){const p=playerState,f=p.lastSid!==s.id;p.lastSid=s.id;return f&&s.trans!=='none'?'fx-'+(s.trans||'fade'):''}
function transPanel(s){return `<div class="fields" style="padding:0;margin-top:12px"><div class="field"><label>Transición de entrada (reproductor)</label><select onchange="currentScene().trans=this.value;touch()">${[['fade','Fundido'],['slide','Deslizar'],['zoom','Zoom'],['none','Ninguna']].map(([v,l])=>`<option value="${v}" ${(s.trans||'fade')===v?'selected':''}>${l}</option>`).join('')}</select></div></div>`}
/* Revisor de problemas */
function lint(){const out=[],S=project.scenes,ok=id=>S.some(x=>x.id===id),has=id=>project.assets.some(a=>a.id===id),vn=new Set(project.variables.map(v=>v.name)),used=new Set(),add=(l,m,s)=>out.push({l,m,s}),chk=(f,s)=>{if(f?.var){used.add(f.var);if(!vn.has(f.var))add('error',`Variable inexistente «${f.var}»`,s.id)}};
S.forEach(s=>{if(!s.dialogues.length)add('warn','Escena sin diálogos',s.id);s.dialogues.forEach((d,i)=>{if(!(d.text||'').trim())add('warn',`Diálogo ${i+1} vacío`,s.id);chk(d.effect,s);if(d.sfx&&!has(d.sfx))add('error',`Diálogo ${i+1}: sonido eliminado`,s.id)});(s.choices||[]).forEach(c=>{if(!c.target||!ok(c.target))add('error',`Opción «${c.text}» sin destino válido`,s.id);if(!(c.text||'').trim())add('warn','Opción sin texto',s.id);chk(c.cond,s);chk(c.effect,s)});if(s.background&&!has(s.background))add('error','El fondo asignado ya no existe',s.id);if(s.music&&!has(s.music))add('error','La música asignada ya no existe',s.id)});
const seen=new Set(),q=S[0]?[S[0].id]:[];while(q.length){const id=q.pop();if(seen.has(id)||!ok(id))continue;seen.add(id);const s=scn(id);(s.choices||[]).forEach(c=>q.push(c.target));if(s.next)q.push(s.next)}
S.filter(s=>!seen.has(s.id)).forEach(s=>add('warn','Escena inaccesible desde el inicio',s.id));project.variables.filter(v=>!used.has(v.name)).forEach(v=>add('warn',`Variable «${v.name}» sin usar`,null));return out}
function lintBadge(){const n=lint().length;return `<span class="lint ${n?'warn':''}" onclick="showProblems()">${n?'⚠ '+n+' problema'+(n>1?'s':''):'✓ Sin problemas'}</span>`}
function showProblems(){const L=lint();modal('Revisión del proyecto',L.length?`<div style="display:grid;gap:6px;max-height:55vh;overflow:auto">${L.map(x=>`<div class="prow ${x.l}"><b>${x.l==='error'?'Error':'Aviso'}</b><span>${x.s?esc(scn(x.s)?.name||'')+': ':''}${esc(x.m)}</span>${x.s?`<button class="small" onclick="closeModal();selectScene('${x.s}')">Ir</button>`:''}</div>`).join('')}</div>`:'<div class="notice">No se han detectado problemas. ✓</div>','<button onclick="closeModal()">Cerrar</button>')}
/* Guardado rápido */
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&project){e.preventDefault();persist();toast('Proyecto guardado')}});
window.addEventListener('beforeunload',()=>{if(project&&dirty)persist()});

/* ===== NovelForge v7: varios personajes en pantalla, atenuado de quien no habla y vista previa fiel ===== */
let selM=null,lastSelD=-1;const MAXC=3;
const freePos=st=>['left','right','center'].find(p=>!st.some(m=>(m.position||'center')===p))||'center';
/* Reparto visible en el diálogo i: el último "stage" explícito (heredado de diálogos anteriores) o, si no hay ninguno, solo quien habla (modo clásico) */
function castAt(s,i){const dl=s.dialogues;if(!dl.length)return{mem:[],on:false,own:false,from:-1};i=Math.max(0,Math.min(i,dl.length-1));for(let k=i;k>=0;k--)if(dl[k].stage)return{mem:dl[k].stage,on:true,own:k===i,from:k};const d=dl[i];return{mem:d.characterId?[d]:[],on:false,own:false,from:-1}}
function ownStage(s,i){const d=s.dialogues[i],c=castAt(s,i);if(c.own)return d.stage;d.stage=c.mem.map(m=>{const o={characterId:m.characterId,expression:m.expression||'Normal'};if(m.position)o.position=m.position;if(m.tf)o.tf={...m.tf};return o});return d.stage}
function selMember(s,i){const c=castAt(s,i),d=s.dialogues[i];let m=c.mem.find(x=>x.characterId===selM);if(!m){m=(d&&c.mem.find(x=>x.characterId===d.characterId))||c.mem[0]||null;selM=m?m.characterId:null}return m}
function edTarget(cid){const s=currentScene(),d=curD();if(!s||!d)return null;if(!castAt(s,selD).on)return cid===d.characterId?d:null;return ownStage(s,selD).find(m=>m.characterId===cid)||null}
function castHTML(s,i,ed){const c=castAt(s,i),d=s.dialogues[i],sp=d&&d.characterId,dim=!!sp&&c.mem.length>1&&c.mem.some(m=>m.characterId===sp),sm=ed?selMember(s,i):null;let out='',fr='';
c.mem.forEach((m,k)=>{const ch=chr(m.characterId);if(!ch)return;const src=ch.sprites?.find(x=>x.name===m.expression)?.data||ch.image;if(!src)return;const z=2+k,cls=dim&&m.characterId!==sp?' dim':'';
if(!ed){out+=`<img class="canvas-character${cls}" style="${spr(m,z)}" src="${src}">`;return}
out+=`<div class="spw${cls}" data-c="${m.characterId}" data-z="${z}" style="${spr(m,z)}"><img src="${src}" draggable="false"></div>`;
if(sm&&sm.characterId===m.characterId)fr=`<div class="selfr" data-c="${m.characterId}" data-z="6" style="${spr(m,6)}"><img src="${src}" draggable="false">${['nw','ne','sw','se','rot'].map(h=>`<i class="hd ${h==='rot'?'rot':''}" data-h="${h}"></i>`).join('')}</div>`});
return out+fr}
function castPanel(s,i){const c=castAt(s,i),d=s.dialogues[i],sm=selMember(s,i),sp=d.characterId;
const rows=c.mem.map(m=>{const ch=chr(m.characterId);if(!ch)return'';const img=ch.sprites?.find(x=>x.name===m.expression)?.data||ch.image;return `<div class="crow ${sm&&sm.characterId===m.characterId?'sel':''}" onclick="selM='${m.characterId}';renderEditor()"><i class="cdot" style="background:${esc(ch.color||'#b6a6ff')}"></i>${img?`<img src="${img}">`:'<span class="cph">♙</span>'}<b>${esc(ch.name)}</b>${m.characterId===sp?'<span class="pill">habla</span>':''}<button class="small ghost danger" title="Quitar de la pantalla" onclick="event.stopPropagation();stDel('${m.characterId}')">×</button></div>`}).join('');
const full=c.mem.length>=MAXC,avail=full?[]:project.characters.filter(x=>!c.mem.some(m=>m.characterId===x.id)),ch=sm&&chr(sm.characterId);
const names=ch?['Normal',sm.expression,...(ch.sprites||[]).map(x=>x.name)].filter((v,k,a)=>v&&a.indexOf(v)===k):[];
const detail=ch?`<div class="cdet"><div class="field"><label>Expresión · ${esc(ch.name)}</label><select onchange="stSet('${sm.characterId}','expression',this.value)">${names.map(n=>`<option ${n===(sm.expression||'Normal')?'selected':''}>${esc(n)}</option>`).join('')}</select>${exprThumbs(sm,ch)}</div><div class="field"><label>Posición</label><div class="seg">${[['left','Izq.'],['center','Centro'],['right','Der.']].map(([v,l])=>`<button class="${(sm.position||'center')===v?'on':''}" onclick="stSet('${sm.characterId}','position','${v}')">${l}</button>`).join('')}</div></div>${tfPanel(sm)}</div>`:'';
const mode=!c.on?'Ahora solo se muestra quien habla. Añade personajes para tener varios en pantalla a la vez.':c.own?'Reparto propio de este diálogo; los siguientes lo heredan.':`Heredado del diálogo ${c.from+1}. Un cambio aquí se mantiene en los siguientes.`;
const back=c.on&&c.own&&s.dialogues.slice(0,i).some(x=>x.stage)?` <a class="lint" onclick="stInherit()">Heredar del anterior</a>`:'';
return `<div class="field"><label>Personajes en pantalla · ${c.mem.length} de ${MAXC}</label></div><div class="cast">${rows||'<div class="muted tiny">Nadie en pantalla.</div>'}</div>${avail.length?`<div class="field"><select onchange="stAdd(this.value)"><option value="">＋ Añadir personaje a la pantalla…</option>${avail.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`:full?`<div class="tiny muted">Máximo ${MAXC} personajes en pantalla.</div>`:project.characters.length?'':'<div class="tiny muted">Crea personajes en la pestaña Personajes.</div>'}<div class="tiny muted">${mode}${back}</div>${detail}`}
function stAdd(cid){if(!cid)return;const s=currentScene(),c0=castAt(s,selD);if(c0.mem.length>=MAXC&&!c0.mem.some(m=>m.characterId===cid))return toast('Máximo '+MAXC+' personajes en pantalla. Quita uno para añadir otro.');const st=ownStage(s,selD);if(!st.some(m=>m.characterId===cid))st.push({characterId:cid,expression:'Normal',position:freePos(st)});selM=cid;touch();renderEditor()}
function stDel(cid){const s=currentScene(),st=ownStage(s,selD),j=st.findIndex(m=>m.characterId===cid);if(j>=0)st.splice(j,1);selM=null;touch();renderEditor()}
function stSet(cid,k,v){const t=edTarget(cid);if(!t)return;t[k]=v;if(k==='position'&&t.tf)delete t.tf.x;touch();renderEditor()}
function stExpr(cid,i){const ch=chr(cid);if(ch&&ch.sprites[i])stSet(cid,'expression',ch.sprites[i].name)}
function stInherit(){const d=curD();if(!d)return;delete d.stage;selM=null;touch();renderEditor()}
if(window.__GAME__){project=window.__GAME__;$('app').classList.add('hidden');playProject()}else load();
